# ──────────────────────────────────────────────────────────────────────────────
# qMR-Robust — Failure Forecasting Configuration
# ──────────────────────────────────────────────────────────────────────────────

project:
  name: qMR-Robust-FailureForecasting
  seed: 42
  device: cuda
  mixed_precision: true
  # Canonical unit convention: T1/T2 always in milliseconds
  t1_t2_units: ms

paths:
  synthetic_mrf:          data/synthetic/mrf_dictionary.h5
  synthetic_mrs:          data/synthetic/mrs_spectra.h5
  failure_forecast_mrf:   data/synthetic/failure_forecast_mrf.h5
  failure_forecast_mrs:   data/synthetic/failure_forecast_mrs.h5
  biggaba:                data/real/biggaba/
  cmrf:                   data/real/cmrf/
  qmrlab_vfa:             data/real/qmrlab/vfa_t1_data
  results:                results/
  checkpoints:            results/checkpoints/

simulation:
  mrf:
    n_signals: 50000
    n_timepoints: 1000
    t1_range: [50.0, 3000.0]   # ms
    t2_range: [5.0, 500.0]     # ms
    m0_range: [0.5, 1.5]
    fa_schedule_variants: 5
    tr_schedule_variants: 3
    vendors: [siemens, philips, ge]
    field_strengths: [1.5, 3.0, 7.0]
    b0_shift_range: [-50.0, 50.0]   # Hz (base domain shift before corruptor)
    b1_scale_range: [0.8, 1.2]
    snr_range: [10.0, 100.0]
    te_ms: 2.0
    n_workers: 16

  mrs:
    n_signals: 10000
    n_points: 2048
    spectral_width: 2000.0
    metabolites: [NAA, Glu, Gln, GABA, Cr, Cho, mI, Ins]
    te_values: [30.0, 68.0, 80.0, 144.0]
    field_strength: 3.0
    linewidth_range: [3.0, 12.0]
    snr_range: [5.0, 50.0]
    phase_error_range: [-30.0, 30.0]
    n_workers: 16

  corruptor:
    b0_off_resonance_range: [-80.0, 80.0]   # Hz
    b1_transmit_scale_range: [0.6, 1.4]
    motion_kspace_max_shift: [8, 8]
    motion_kspace_rotation_range: [-15.0, 15.0]
    default_tr_ms: 12.0          # inter-sample time for B0 phase ramps
    n_motion_segments: 8
    independent_apply_prob: 0.5
    probability_weights:
      b0: 1.0
      b1: 1.0
      motion: 1.0

# Default configuration for the ResNet-1D evidential baseline
model:
  architecture: resnet1d
  input_channels: 2
  hidden_dim: 128
  dropout: 0.1
  patch_size: 50
  n_heads: 4
  n_transformer_layers: 4
  evidential: true

training:
  batch_size: 512
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  n_epochs: 30
  early_stopping_patience: 15
  scheduler: cosine
  warmup_epochs: 0
  gradient_clip_val: 5.0
  n_workers: 4
  evidential_coeff: 1.0
  annealing_start: 0
  annealing_epochs: 10

evaluation:
  metrics: [mae, rmse, spearman_rho, normalized_ece, auroc]
  epistemic_threshold: 0.1
  failure_residual_ms: 300.0
  # Real VFA is cross-sequence OOD (not in-vivo MRF)
  real_protocol: vfa_cross_sequence_zeropad
  output_json: true
