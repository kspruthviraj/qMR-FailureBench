# ──────────────────────────────────────────────────────────────────────────────
# qMR-Robust — Failure Forecasting Configuration
# ──────────────────────────────────────────────────────────────────────────────

project:
  name: qMR-Robust-FailureForecasting
  seed: 42
  device: cuda
  mixed_precision: true

paths:
  synthetic_mrf:          data/synthetic/mrf_dictionary.h5
  synthetic_mrs:          data/synthetic/mrs_spectra.h5
  failure_forecast_mrf:   data/synthetic/failure_forecast_mrf.h5
  failure_forecast_mrs:   data/synthetic/failure_forecast_mrs.h5
  biggaba:                data/real/biggaba/
  cmrf:                   data/real/cmrf/
  results:                results/
  checkpoints:            results/checkpoints/

simulation:
  mrf:
    n_signals: 500000
    n_timepoints: 1000
    t1_range: [50.0, 3000.0]
    t2_range: [5.0, 500.0]
    m0_range: [0.5, 1.5]
    fa_schedule_variants: 5
    tr_schedule_variants: 3
    vendors: [siemens, philips, ge]
    field_strengths: [1.5, 3.0, 7.0]
    b0_shift_range: [-50.0, 50.0]
    b1_scale_range: [0.8, 1.2]
    snr_range: [10.0, 100.0]
    n_workers: 16

  mrs:
    n_signals: 100000
    n_points: 2048
    spectral_width: 2000.0
    metabolites: [NAA, Glu, Gln, GABA, Cr, Cho, mI, Ins]
    te_values: [30.0, 68.0, 80.0, 144.0]
    field_strength: 3.0
    linewidth_range: [3.0, 12.0]
    snr_range: [5.0, 50.0]
    phase_error_range: [-30.0, 30.0]
    n_workers: 16

  corruptor:
    b0_off_resonance_range: [-80.0, 80.0]
    b1_transmit_scale_range: [0.6, 1.4]
    motion_kspace_max_shift: [8, 8]
    motion_kspace_rotation_range: [-15.0, 15.0]
    probability_weights:
      b0: 1.0
      b1: 1.0
      motion: 1.0

model:
  architecture: vit1d
  input_channels: 2
  hidden_dim: 256
  dropout: 0.1
  patch_size: 32
  n_heads: 8
  n_transformer_layers: 6
  evidential: true

training:
  batch_size: 512
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  n_epochs: 100
  early_stopping_patience: 15
  scheduler: cosine
  warmup_epochs: 5
  gradient_clip_val: 1.0
  n_workers: 8
  evidential_coeff: 1.0
  annealing_start: 0
  annealing_epochs: 10

evaluation:
  metrics: [mae, rmse, r2, aleatoric_unc, epistemic_unc, failure_flag]
  epistemic_threshold: 0.1
  output_json: true
